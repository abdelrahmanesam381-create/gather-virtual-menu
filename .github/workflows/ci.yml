name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: menu
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: menu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://menu:ci_only@localhost:5432/menu_test
      TEST_DATABASE_URL: postgresql://menu:ci_only@localhost:5432/menu_test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run docs:check
      - run: npm run format:check
      - run: npm run check:patterns
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run typecheck
